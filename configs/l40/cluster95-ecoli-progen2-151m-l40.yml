# L40/L40S config: ProGen2 151M fine-tuning on E. coli cluster95 splits
# Designed for L40/L40S GPUs with ~48 GB VRAM.

# Data paths
train_path: "./data/final_cluster95/ecoli/train.faa"
eval_path: "./data/final_cluster95/ecoli/val.faa"
# test_path: "./data/final_cluster95/ecoli/test.faa"

# Base model
base_model: "hugohrban/progen2-small"

# Weights & Biases
wandb_project: "progen2_151m_ecoli_cluster95_l40_final"

training_args:
  output_dir: "runs/progen2_151m_ecoli_cluster95_l40"
  overwrite_output_dir: true
  run_name: "progen2_151m_ecoli_cluster95_l40"

  # L40-safe batch settings
  # Effective batch size = 8 * 16 = 128
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 16

  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_steps: 200

  fp16: true

  num_train_epochs: 25

  evaluation_strategy: "steps"
  eval_steps: 10
  do_eval: true
  prediction_loss_only: true
  eval_on_start: false
  logging_strategy: "steps"
  logging_steps: 10
  logging_first_step: false
  save_strategy: "no"
  save_steps: 10

  load_best_model_at_end: false
  metric_for_best_model: "eval_loss"
  greater_is_better: false

  save_total_limit: 3
  report_to: ["wandb"]

  remove_unused_columns: false
  dataloader_num_workers: 1
